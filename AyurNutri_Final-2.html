<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>AyurNutri</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #EDE8DE;
      --sf: #FFF;
      --sf2: #F4F0E8;
      --sf3: #EAE5DA;
      --hero: #1B3920;
      --hero2: #122616;
      --hc: rgba(255, 255, 255, .10);
      --hbd: rgba(255, 255, 255, .14);
      --tx: #18271A;
      --tx2: #5C6E5D;
      --tx3: #98A89A;
      --txi2: rgba(255, 255, 255, .58);
      --green: #1B3920;
      --green2: #2C5432;
      --greenL: #36B56A;
      --gBg: rgba(54, 181, 106, .10);
      --gBd: rgba(54, 181, 106, .20);
      --gold: #A87208;
      --goldL: #C88A10;
      --goBg: rgba(168, 114, 8, .10);
      --goBd: rgba(168, 114, 8, .22);
      --tipBg: #F2E8B4;
      --tipBd: rgba(168, 114, 8, .20);
      --or: #C44E1C;
      --bl: #2E68B0;
      --bd: rgba(0, 0, 0, .07);
      --bd2: rgba(0, 0, 0, .04);
      --nb: #fff;
      --ns: 0 -2px 24px rgba(0, 0, 0, .10);
      --s1: 0 1px 3px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .04);
      --s2: 0 4px 18px rgba(0, 0, 0, .12);
      --HERO_IMG_H: 220px;
    }

    [data-theme=dark] {
      --bg: #0C1A0E;
      --sf: #162818;
      --sf2: #1C3020;
      --sf3: #223828;
      --hero: #0E1C10;
      --hero2: #091208;
      --hc: rgba(255, 255, 255, .07);
      --hbd: rgba(255, 255, 255, .10);
      --tx: #E6EDE6;
      --tx2: rgba(230, 237, 230, .52);
      --tx3: rgba(230, 237, 230, .30);
      --txi2: rgba(255, 255, 255, .50);
      --green: #2C5432;
      --green2: #386840;
      --greenL: #42C876;
      --gBg: rgba(66, 200, 118, .10);
      --gBd: rgba(66, 200, 118, .20);
      --gold: #BE8C10;
      --goldL: #DCA820;
      --goBg: rgba(190, 140, 16, .12);
      --goBd: rgba(190, 140, 16, .24);
      --tipBg: rgba(168, 114, 8, .13);
      --tipBd: rgba(190, 140, 16, .18);
      --or: #D45E28;
      --bl: #4480CC;
      --bd: rgba(255, 255, 255, .08);
      --bd2: rgba(255, 255, 255, .04);
      --nb: #162818;
      --ns: 0 -2px 24px rgba(0, 0, 0, .45);
      --s1: 0 1px 3px rgba(0, 0, 0, .28), 0 2px 8px rgba(0, 0, 0, .20);
      --s2: 0 4px 18px rgba(0, 0, 0, .40);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #1A1A1A;
      overflow: hidden;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /* ══ LAYOUT ══ */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .phone {
      width: 393px;
      height: 852px;
      border-radius: 52px;
      overflow: hidden;
      position: relative;
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .10), 0 40px 90px rgba(0, 0, 0, .65);
      transition: background .25s;
      display: flex;
      flex-direction: column;
    }

    @media(max-width:479px) {
      body {
        background: var(--bg);
      }

      .page {
        display: block;
        width: auto;
        height: auto;
      }

      .phone {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
    }

    .tog {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9999;
      padding: 9px 16px;
      border-radius: 40px;
      background: rgba(255, 255, 255, .13);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .16);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media(max-width:479px) {
      .tog {
        display: none;
      }
    }

    /* Status bar */
    .sbar {
      flex-shrink: 0;
      height: 46px;
      padding: 15px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--hero);
      transition: background .25s;
    }

    .sbar-t {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .sbar-i {
      font-size: 12px;
      color: rgba(255, 255, 255, .65);
    }

    @media(max-width:479px) {
      .sbar {
        display: none;
      }
    }

    .main-scr {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Hero */
    .hero {
      background: linear-gradient(168deg, var(--hero) 0%, var(--hero2) 100%);
      padding: 10px 22px 26px;
      border-radius: 0 0 30px 30px;
      transition: background .25s;
    }

    @media(max-width:479px) {
      .hero {
        padding-top: calc(env(safe-area-inset-top, 10px) + 10px);
      }
    }

    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .hero-greet {
      font-size: 13px;
      font-weight: 500;
      color: var(--txi2);
      margin-bottom: 2px;
    }

    .hero-name {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      font-family: 'Playfair Display', serif;
      letter-spacing: -.3px;
    }

    .hero-tbtn {
      padding: 7px 14px;
      border-radius: 30px;
      background: var(--hc);
      border: 1px solid var(--hbd);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    @media(max-width:479px) {
      .hero-tbtn {
        display: flex;
      }
    }

    .hero-av {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--hc);
      border: 2px solid var(--hbd);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    @media(max-width:479px) {
      .hero-av {
        display: none;
      }
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .tile {
      background: var(--hc);
      border: 1px solid var(--hbd);
      border-radius: 18px;
      padding: 13px 9px;
      text-align: center;
    }

    .tile-i {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .tile-v {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .tile-l {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--txi2);
      margin-top: 2px;
    }

    .body {
      padding: 0 16px 120px;
      background: var(--bg);
      transition: background .25s;
    }

    .sec-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 2px 11px;
    }

    .sec-t {
      font-size: 17px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
    }

    .sec-l {
      font-size: 12px;
      font-weight: 700;
      color: var(--goldL);
    }

    .cal-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 13px;
    }

    .cday {
      flex-shrink: 0;
      min-width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9px 10px 8px;
      border-radius: 18px;
      cursor: pointer;
      background: var(--sf);
      border: 1.5px solid var(--bd);
      box-shadow: var(--s1);
      transition: all .22s;
      user-select: none;
    }

    .cday:active {
      transform: scale(.93);
    }

    .cday.on {
      background: var(--green);
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(27, 57, 32, .28);
    }

    .cd-l {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tx3);
    }

    .cday.on .cd-l {
      color: rgba(255, 255, 255, .48);
    }

    .cd-n {
      font-size: 21px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
      line-height: 1;
    }

    .cday.on .cd-n {
      color: #fff;
    }

    .cd-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--goldL);
      margin-top: 5px;
      opacity: 0;
    }

    .cday.today .cd-dot {
      opacity: 1;
    }

    .cday.on .cd-dot {
      opacity: .6;
    }

    .cday.on.today .cd-dot {
      background: rgba(255, 255, 255, .7);
    }

    .dbrow {
      display: flex;
      gap: 7px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .db {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .db.th {
      background: var(--green);
      color: #fff;
    }

    [data-theme=dark] .db.th {
      background: var(--green2);
    }

    .db.kc {
      background: var(--goBg);
      color: var(--gold);
      border: 1px solid var(--goBd);
    }

    .db.pr {
      background: var(--gBg);
      color: var(--greenL);
      border: 1px solid var(--gBd);
    }

    /* MEAL CARDS */
    .meal-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mc {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      cursor: pointer;
      box-shadow: var(--s1);
      transition: transform .18s, box-shadow .18s;
      animation: riseUp .32s ease both;
      user-select: none;
    }

    @keyframes riseUp {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .mc:nth-child(1) {
      animation-delay: .00s
    }

    .mc:nth-child(2) {
      animation-delay: .07s
    }

    .mc:nth-child(3) {
      animation-delay: .14s
    }

    .mc:nth-child(4) {
      animation-delay: .21s
    }

    .mc:active {
      transform: scale(.978);
    }

    .mc-bar {
      width: 4px;
      flex-shrink: 0;
    }

    .mc-bar.B {
      background: var(--gold);
    }

    .mc-bar.L {
      background: var(--green);
    }

    [data-theme=dark] .mc-bar.L {
      background: var(--greenL);
    }

    .mc-bar.S {
      background: var(--or);
    }

    .mc-bar.D {
      background: var(--bl);
    }

    .mc-th {
      width: 90px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: var(--sf2);
    }

    .mc-th img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s;
    }

    .mc:active .mc-th img {
      transform: scale(1.07);
    }

    .mc-ph {
      width: 100%;
      min-height: 90px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .mc-badge {
      position: absolute;
      top: 8px;
      left: 7px;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: #fff;
      backdrop-filter: blur(10px);
    }

    .mc-badge.B {
      background: rgba(168, 114, 8, .90);
    }

    .mc-badge.L {
      background: rgba(27, 57, 32, .92);
    }

    [data-theme=dark] .mc-badge.L {
      background: rgba(66, 200, 118, .76);
    }

    .mc-badge.S {
      background: rgba(196, 78, 28, .90);
    }

    .mc-badge.D {
      background: rgba(46, 104, 176, .90);
    }

    .mc-inf {
      flex: 1;
      padding: 11px 12px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .mc-time {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--tx3);
    }

    .mc-name {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
      letter-spacing: -.2px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mc-desc {
      font-size: 10px;
      color: var(--tx2);
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mc-chips {
      display: flex;
      gap: 5px;
      margin-top: 4px;
    }

    .mc-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      background: var(--gBg);
      color: var(--greenL);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .mc-meta {
      flex-shrink: 0;
      padding: 11px 14px 11px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
    }

    .mc-kc {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }

    .mc-kl {
      font-size: 8px;
      color: var(--tx3);
      font-weight: 600;
      text-align: right;
    }

    .mc-arr {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(27, 57, 32, .24);
      transition: transform .18s;
    }

    [data-theme=dark] .mc-arr {
      box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
    }

    .tip-card {
      background: var(--tipBg);
      border: 1px solid var(--tipBd);
      border-radius: 20px;
      padding: 16px;
      margin-top: 8px;
    }

    .tip-hd {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .tip-ic {
      font-size: 16px;
    }

    .tip-lb {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
    }

    .tip-tx {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--gold);
      line-height: 1.65;
    }

    /* Bottom nav */
    .bnav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      background: var(--nb);
      border-radius: 28px 28px 52px 52px;
      box-shadow: var(--ns);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 20px 18px;
      z-index: 50;
      border-top: 1px solid var(--bd2);
      transition: all .25s;
    }

    @media(max-width:479px) {
      .bnav {
        border-radius: 0;
        height: calc(62px + env(safe-area-inset-bottom, 0px));
        padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      }
    }

    .ni {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .ni-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: all .2s;
    }

    .ni.on .ni-btn {
      background: var(--gold);
      box-shadow: 0 3px 12px rgba(168, 114, 8, .30);
    }

    .ni-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      transition: opacity .2s;
    }

    .ni.on .ni-dot {
      opacity: 1;
    }

    /* OVERLAY */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      border-radius: inherit;
    }

    .overlay.on {
      opacity: 1;
      pointer-events: all;
    }

    /* ═══════════════════════════════════════════════
   BOTTOM SHEET — with BIG HERO IMAGE at top
   that shrinks as user scrolls down
═══════════════════════════════════════════════ */
    .sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 201;
      max-height: 82%;
      /* leaves 18% visible above — enough to see bg */
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(102%);
      transition: transform .40s cubic-bezier(.32, .72, 0, 1), background .25s;
      box-shadow: 0 -8px 48px rgba(0, 0, 0, .25);
    }

    .sheet.open {
      transform: translateY(0);
    }

    /* The inner scroll area of the sheet */
    .sheet-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── BIG HERO IMAGE (top of sheet) ─── */
    .sh-hero {
      position: relative;
      width: 100%;
      height: var(--HERO_IMG_H);
      /* 220px */
      flex-shrink: 0;
      overflow: hidden;
      background: #111;
    }

    .sh-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sh-hero-ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      background: var(--sf2);
    }

    /* gradient fade at bottom of hero image */
    .sh-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.55) 100%);
    }

    /* type badge overlaid on hero image */
    .sh-hero-badge {
      position: absolute;
      bottom: 14px;
      left: 16px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: #fff;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .22);
    }

    .sh-hero-badge.B {
      background: rgba(168, 114, 8, .85);
    }

    .sh-hero-badge.L {
      background: rgba(27, 57, 32, .88);
    }

    [data-theme=dark] .sh-hero-badge.L {
      background: rgba(42, 160, 90, .82);
    }

    .sh-hero-badge.S {
      background: rgba(196, 78, 28, .85);
    }

    .sh-hero-badge.D {
      background: rgba(46, 104, 176, .85);
    }

    /* close btn on hero */
    .sh-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .40);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .22);
      display: grid;
      place-items: center;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      transition: background .18s;
    }

    .sh-close:active {
      background: rgba(0, 0, 0, .65);
    }

    /* drag pill on hero */
    .sh-pill {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .40);
      cursor: pointer;
    }

    /* ─── STICKY MINI HEADER (appears when scrolled) ─── */
    /* sits right below hero, becomes sticky as hero scrolls away */
    .sh-mini-hd {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--sf);
      border-bottom: 1px solid var(--bd2);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      /* hidden by default, JS fades it in on scroll */
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }

    .sh-mini-hd.visible {
      opacity: 1;
      pointer-events: all;
    }

    .sh-mini-img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--sf2);
    }

    .sh-mini-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sh-mini-name {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sh-mini-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--sf2);
      border: 1px solid var(--bd);
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--tx2);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ─── SHEET CONTENT BODY ─── */
    .sh-content {
      background: var(--bg);
      border-radius: 20px 20px 0 0;
      margin-top: -20px;
      /* pulls up over the hero image bottom */
      position: relative;
      z-index: 2;
      padding: 0 0 20px;
      transition: background .25s;
    }

    /* Meal name + dosha inside content */
    .sh-title-block {
      padding: 18px 18px 0;
    }

    .sh-dosha-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--greenL);
      margin-bottom: 5px;
    }

    .sh-meal-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
      letter-spacing: -.4px;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    /* Macro pills */
    .sh-mac {
      display: flex;
      gap: 8px;
      padding: 0 18px 16px;
    }

    .shm {
      flex: 1;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      box-shadow: var(--s1);
    }

    .shm-v {
      font-size: 18px;
      font-weight: 800;
      font-family: 'Playfair Display', serif;
      letter-spacing: -.5px;
    }

    .shm-v.kc {
      color: var(--gold);
    }

    .shm-v.pr {
      color: var(--bl);
    }

    .shm-v.cr {
      color: var(--greenL);
    }

    .shm-v.ft {
      color: var(--or);
    }

    .shm-l {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--tx3);
      margin-top: 2px;
    }

    /* TABS */
    .sh-tabs {
      display: flex;
      gap: 4px;
      padding: 0 18px 0;
      border-bottom: 1px solid var(--bd2);
      position: sticky;
      top: 0;
      z-index: 9;
      background: var(--bg);
      transition: background .25s;
    }

    .stab {
      padding: 10px 16px;
      border-radius: 20px 20px 0 0;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--tx3);
      cursor: pointer;
      transition: all .18s;
      user-select: none;
      border-bottom: 2.5px solid transparent;
      margin-bottom: -1px;
    }

    .stab:hover {
      color: var(--tx2);
    }

    .stab.on {
      color: var(--green);
      border-bottom-color: var(--green);
      background: transparent;
    }

    [data-theme=dark] .stab.on {
      color: var(--greenL);
      border-bottom-color: var(--greenL);
    }

    .spane {
      display: none;
      padding: 16px 18px 30px;
    }

    .spane.on {
      display: block;
    }

    .s-lbl {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--tx3);
      margin: 14px 0 9px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .s-lbl::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bd);
    }

    /* Overview */
    .ov-nutr {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 2px;
    }

    .ov-ring {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .ov-rl {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tx3);
    }

    .ov-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .ob-hd {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .ob-n {
      font-size: 11px;
      font-weight: 700;
      color: var(--tx);
    }

    .ob-v {
      font-size: 10px;
      color: var(--tx3);
    }

    .ob-tr {
      height: 6px;
      background: var(--sf2);
      border-radius: 3px;
      overflow: hidden;
    }

    .ob-f {
      height: 100%;
      border-radius: 3px;
      transition: width 1.1s cubic-bezier(.34, 1.5, .64, 1) .1s;
    }

    .ob-f.p {
      background: linear-gradient(90deg, var(--bl), #5090D8);
    }

    .ob-f.c {
      background: linear-gradient(90deg, var(--green2), var(--greenL));
    }

    .ob-f.f {
      background: linear-gradient(90deg, var(--gold), var(--goldL));
    }

    .ob-f.fi {
      background: linear-gradient(90deg, var(--or), #E07050);
    }

    .ap-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 2px;
    }

    .apc {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .apc-l {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tx3);
      margin-bottom: 3px;
    }

    .apc-v {
      font-size: 12px;
      font-weight: 700;
      color: var(--tx);
    }

    .rasa-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 2px;
    }

    .rtag {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      border: 1.5px solid;
    }

    .rtag.sw {
      background: var(--goBg);
      color: var(--gold);
      border-color: var(--goBd);
    }

    .rtag.bi {
      background: var(--gBg);
      color: var(--greenL);
      border-color: var(--gBd);
    }

    .rtag.as {
      background: rgba(46, 104, 176, .09);
      color: var(--bl);
      border-color: rgba(46, 104, 176, .18);
    }

    .prep-tip {
      background: var(--tipBg);
      border: 1px solid var(--tipBd);
      border-left: 3.5px solid var(--gold);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .pt-ic {
      font-size: 16px;
      flex-shrink: 0;
    }

    .pt-tx {
      font-size: 12px;
      font-weight: 500;
      color: var(--gold);
      line-height: 1.68;
    }

    /* Ingredients */
    .ing-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .ing-top-t {
      font-size: 15px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
    }

    .ing-b {
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      background: var(--gBg);
      color: var(--greenL);
    }

    .ing-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ii {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .ii-n {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gBg);
      color: var(--greenL);
      font-size: 9px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .ii-col {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ii-wr {
      flex: 1;
      min-width: 0;
    }

    .ii-nm {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ii-nt {
      font-size: 9px;
      color: var(--tx3);
      margin-top: 1px;
    }

    .ii-q {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      background: var(--goBg);
      padding: 3px 10px;
      border-radius: 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════
   VIDEO SECTION — REDESIGNED
   Large thumbnail cards like YouTube/Swiggy
═══════════════════════════════════════ */
    .vid-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .vid-hdr-t {
      font-size: 15px;
      font-weight: 800;
      color: var(--tx);
      font-family: 'Playfair Display', serif;
    }

    .vid-hdr-s {
      font-size: 10px;
      font-weight: 700;
      color: var(--greenL);
      background: var(--gBg);
      border: 1px solid var(--gBd);
      border-radius: 10px;
      padding: 3px 10px;
    }

    /* VIDEO CARD — large, immersive */
    .vid-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vc {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--s1);
      transition: transform .18s, box-shadow .18s;
      cursor: pointer;
    }

    .vc:active {
      transform: scale(.98);
    }

    /* Large thumbnail */
    .vc-thumb {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 52%;
      /* 16:9ish */
      background: #111;
      overflow: hidden;
    }

    .vc-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s;
    }

    .vc.open .vc-thumb img,
    .vc:active .vc-thumb img {
      transform: scale(1.04);
    }

    .vc-thumb-ph {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: var(--sf2);
    }

    /* big play button overlay */
    .vc-play-ov {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .20);
      transition: background .2s;
    }

    .vc.open .vc-play-ov {
      background: rgba(0, 0, 0, .30);
    }

    .vc-play-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(220, 20, 20, .90);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(220, 20, 20, .45);
      transition: transform .2s;
    }

    .vc:active .vc-play-circle {
      transform: scale(.92);
    }

    /* rank badge */
    .vc-rank {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .vc.open .vc-rank {
      background: var(--greenL);
      color: #fff;
    }

    /* match % badge */
    .vc-score {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .vc-score.hi {
      background: rgba(27, 57, 32, .85);
      color: #6EE8A2;
    }

    .vc-score.mi {
      background: rgba(100, 70, 0, .80);
      color: #F0C060;
    }

    .vc-score.lo {
      background: rgba(160, 50, 20, .80);
      color: #F4A080;
    }

    /* dosha chip bottom-left of thumb */
    .vc-dosha {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 800;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .vc-dosha.ex {
      background: rgba(27, 57, 32, .85);
      color: #6EE8A2;
    }

    .vc-dosha.go {
      background: rgba(30, 60, 140, .82);
      color: #90C0FF;
    }

    .vc-dosha.pa {
      background: rgba(100, 70, 0, .80);
      color: #F0C060;
    }

    /* Card info row below thumb */
    .vc-info {
      padding: 12px 14px;
    }

    .vc-row1 {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .vc-ch-av {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    [data-theme=dark] .vc-ch-av {
      background: var(--green2);
    }

    .vc-meta {
      flex: 1;
      min-width: 0;
    }

    .vc-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--tx);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .vc-ch {
      font-size: 10px;
      color: var(--tx3);
      margin-top: 2px;
    }

    /* match bar */
    .vc-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .vc-bar-tr {
      flex: 1;
      height: 5px;
      background: var(--sf2);
      border-radius: 3px;
      overflow: hidden;
    }

    .vc-bar-f {
      height: 100%;
      border-radius: 3px;
      transition: width .9s ease .05s;
    }

    .vc-bar-f.hi {
      background: linear-gradient(90deg, var(--green2), var(--greenL));
    }

    .vc-bar-f.mi {
      background: linear-gradient(90deg, var(--gold), var(--goldL));
    }

    .vc-bar-f.lo {
      background: var(--or);
    }

    .vc-bar-pct {
      font-size: 10px;
      font-weight: 800;
      color: var(--tx2);
      flex-shrink: 0;
    }

    /* ingredient chips */
    .vc-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
    }

    .vc-chip {
      font-size: 9.5px;
      padding: 3px 9px;
      border-radius: 9px;
      font-weight: 700;
    }

    .vc-chip.m {
      background: var(--gBg);
      color: var(--greenL);
    }

    .vc-chip.x {
      background: var(--sf3);
      color: var(--tx3);
      text-decoration: line-through;
    }

    /* reason text */
    .vc-reason {
      font-size: 11px;
      color: var(--tx2);
      line-height: 1.6;
      font-style: italic;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--sf2);
      border-radius: 10px;
      border-left: 3px solid var(--gBd);
    }

    /* inline player */
    .vc-player {
      width: 100%;
      border-radius: 0 0 0 0;
      overflow: hidden;
      background: #000;
      display: none;
    }

    .vc-player.on {
      display: block;
    }

    .vc-player iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      display: block;
    }

    /* EXPANDED state — show player + details */
    .vc-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height .38s cubic-bezier(.4, 0, .2, 1);
    }

    .vc.open .vc-expand {
      max-height: 600px;
    }

    /* watch / stop button */
    .vc-btn {
      width: 100%;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--green);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all .18s;
      border: none;
      border-radius: 12px;
    }

    [data-theme=dark] .vc-btn {
      background: var(--green2);
    }

    .vc-btn:active {
      transform: scale(.97);
    }

    .vc-btn.stop {
      background: #C01818;
    }
  </style>
</head>

  <div class="page">

          <div class="tiles">

            <div class="tile">

            <div class="tile">

              <div class="tile-v">7 Days</div>
              <div class="tile-l">Streak</div>
            </div>
          </div>
        </div>
        <div class="body">
          <div class="sec-row"><span class="sec-t">Meal Plan</span><span class="sec-l">Week 3 ›</span></div>
          <div class="cal-row" id="cal-row"></div>
          <div class="dbrow" id="dbrow"></div>
          <div class="sec-row" style="padding-top:4px;"><span class="sec-t" id="meal-title" style="font-size:15px;">Day
              1 · 4 Meals</span></div>
          <div class="meal-list" id="meal-list"></div>

          </div>

      </div>

      <div class="bnav">

        <div class="ni on" onclick="setNav(this)">
          <div class="ni-btn">🍽️</div>
          <div class="ni-dot"></div>
        </div>
        <div class="ni" onclick="setNav(this)">
          <div class="ni-btn">⬛</div>
          <div class="ni-dot"></div>
        </div>
        <div class="ni" onclick="setNav(this)">
          <div class="ni-btn">👤</div>
          <div class="ni-dot"></div>
        </div>
      </div>

      <div class="overlay" id="overlay" onclick="closeSheet()"></div>

      <!-- SHEET -->
      <div class="sheet" id="sheet">

        <div class="sheet-scroll" id="sheet-scroll">

          <!-- BIG FOOD HERO IMAGE -->
          <div class="sh-hero" id="sh-hero">
            <img id="sh-img" src="" alt=""
              onerror="this.style.display='none';document.getElementById('sh-img-ph').style.display='flex'" />
            <div class="sh-hero-ph" id="sh-img-ph" style="display:none">🍲</div>
            <!-- gradient overlay is via ::after -->
            <div class="sh-pill" onclick="closeSheet()"></div>
            <div class="sh-hero-badge" id="sh-badge">🌅 Breakfast</div>
            <div class="sh-close" onclick="closeSheet()">✕</div>
          </div>

          <!-- STICKY MINI HEADER (fades in when hero scrolls out) -->

 col: '#88A08A', note: 'low-sodium' }, { n: 'Cow ghee', q: '½ tsp', col: '#C88A10', note: 'absorption aid' }, { n: 'Black pepper', q: 'pinch', col: '#2A3A2C', note: 'bioavailability' }, { n: 'Rock salt', q: 'taste', col: '#88A08A', note: '' }]];
    const VIDS = [{ t: 'Moong Dal Khichdi — One Pot Healthy Meal', ch: "Hebbar's Kitchen", chI: 'H', th: 'https://img.youtube.com/vi/0eepbO3UBPU/mqdefault.jpg', id: '0eepbO3UBPU', score: 88, dm: 'ex', dml: '🌿 Perfect for Pitta', m: ['moong dal', 'rice', 'ghee', 'turmeric'], x: ['ginger'], rsn: 'Ghee and rock salt throughout. All Pitta-cooling spices perfectly preserved. Best preparation available.' }, { t: 'Healthy Dal Khichdi | Simple & Nutritious', ch: "Kabita's Kitchen", chI: 'K', th: 'https://img.youtube.com/vi/KsUifaK5iG8/mqdefault.jpg', id: 'KsUifaK5iG8', score: 74, dm: 'go', dml: '✅ Good for Pitta', m: ['moong dal', 'rice', 'turmeric'], x: ['ghee', 'ginger'], rsn: 'Good ingredient overlap. Replace oil with ghee to improve Pitta compatibility.' }, { t: 'Restaurant Style Dal Khichdi', ch: 'Rajshri Food', chI: 'R', th: 'https://img.youtube.com/vi/9_rJPGNGzaE/mqdefault.jpg', id: '9_rJPGNGzaE', score: 62, dm: 'go', dml: '✅ Good for Pitta', m: ['moong dal', 'rice', 'ghee'], x: ['turmeric'], rsn: 'Pitta-friendly base. Add cumin and rock salt, reduce regular salt for better results.' }, { t: 'Saatvik Moong Dal Khichdi', ch: 'Sanjeev Kapoor Khazana', chI: 'S', th: 'https://img.youtube.com/vi/fkk1GHBHUSM/mqdefault.jpg', id: 'fkk1GHBHUSM', score: 52, dm: 'pa', dml: '⚠️ Partial match', m: ['moong dal', 'rice'], x: ['ghee', 'turmeric'], rsn: 'Replace butter with ghee and reduce mustard seeds for better Pitta balance.' }, { t: 'Easy Khichdi for Digestion', ch: 'Nisha Madhulika', chI: 'N', th: 'https://img.youtube.com/vi/W9YMjBFaK44/mqdefault.jpg', id: 'W9YMjBFaK44', score: 44, dm: 'pa', dml: '⚠️ Partial match', m: ['moong dal'], x: ['rice', 'ghee', 'cumin'], rsn: 'Add ghee and reduce tomato and onion for proper Pitta-Vata balance.' }].sort((a, b) => b.score - a.score);

    let isDark = false, activeDay = 0, playingVid = {}, openVC = -1;
    let savedScroll = 0;

    /* ── scroll lock ── */
    function lockBg() { const ms = document.getElementById('main-scr'); savedScroll = ms.scrollTop; ms.style.overflow = 'hidden'; }
    function unlockBg() { const ms = document.getElementById('main-scr'); ms.style.overflow = ''; ms.scrollTop = savedScroll; }

    /* ── sheet height ── */
    function applySheetHeight() {

    /* ── mini header fade on scroll ── */
    function setupSheetScroll() {
      const ss = document.getElementById('sheet-scroll');

    function setNav(el) { document.querySelectorAll('.ni').forEach(n => n.classList.remove('on')); el.classList.add('on'); }

    function buildCal() {
      const w = document.getElementById('cal-row');
      DAYS.forEach((d, i) => {
        const el = document.createElement('div');
        el.className = 'cday' + (i === 0 ? ' on today' : ''); el.onclick = () => selDay(i);
        el.innerHTML = `<div class="cd-l">${d.l}</div><div class="cd-n">${d.n}</div><div class="cd-dot"></div>`;
        w.appendChild(el);
      });
    }

      activeDay = i;
      document.querySelectorAll('.cday').forEach((e, j) => e.classList.toggle('on', j === i));

      document.getElementById('dbrow').innerHTML = `<div class="db th">${d.tag}</div><div class="db kc">🔥 ${d.kc} kcal</div><div class="db pr">💪 ${d.pr}g protein</div>`;

    function renderMeals(di) {
      const w = document.getElementById('meal-list'); w.innerHTML = '';

    function buildOv(mi, cal, pro, car, fat, fib) {
      const tot = pro * 4 + car * 4 + fat * 9 || 1;
      const pp = Math.round(pro * 4 / tot * 100), cp = Math.round(car * 4 / tot * 100), fp = 100 - pp - cp;
      const R = 32, CX = 36, CY = 36, c2 = 2 * Math.PI * R;
      const segs = [{ p: cp, col: '#36B56A', r: -90 }, { p: pp, col: '#2E68B0', r: -90 + cp * 3.6 }, { p: fp, col: '#A87208', r: -90 + (cp + pp) * 3.6 }];
      const arcs = segs.map(s => `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${s.col}" stroke-width="9" stroke-dasharray="${c2}" stroke-dashoffset="${c2 * (1 - s.p / 100)}" transform="rotate(${s.r} ${CX} ${CY})" stroke-linecap="round" opacity=".9"/>`).join('');
      const rH = (RASA[mi] || []).map(r => `<span class="rtag ${r.c}">${r.l}</span>`).join('');
      document.getElementById('tab-ov').innerHTML = `<div class="ov-nutr"><div class="ov-ring"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--sf2)" stroke-width="9"/>${arcs}<text x="${CX}" y="${CY - 1}" text-anchor="middle" fill="var(--tx)" font-size="10" font-weight="800" font-family="Playfair Display,serif">${cal}</text><text x="${CX}" y="${CY + 10}" text-anchor="middle" fill="var(--tx3)" font-size="7" font-family="Nunito,sans-serif">kcal</text></svg><div class="ov-rl">Macros</div></div><div class="ov-bars"><div><div class="ob-hd"><span class="ob-n">Protein</span><span class="ob-v">${pro}g · ${pp}%</span></div><div class="ob-tr"><div class="ob-f p" style="width:${Math.min(100, pro / 60 * 100)}%"></div></div></div><div><div class="ob-hd"><span class="ob-n">Carbs</span><span class="ob-v">${car}g · ${cp}%</span></div><div class="ob-tr"><div class="ob-f c" style="width:${Math.min(100, car / 250 * 100)}%"></div></div></div><div><div class="ob-hd"><span class="ob-n">Fat</span><span class="ob-v">${fat}g · ${fp}%</span></div><div class="ob-tr"><div class="ob-f f" style="width:${Math.min(100, fat / 55 * 100)}%"></div></div></div><div><div class="ob-hd"><span class="ob-n">Fiber</span><span class="ob-v">${fib}g</span></div><div class="ob-tr"><div class="ob-f fi" style="width:${Math.min(100, fib / 30 * 100)}%"></div></div></div></div></div><div class="s-lbl">Ayurvedic Profile</div><div class="ap-grid"><div class="apc"><div class="apc-l">Guna</div><div class="apc-v">${GUNA[mi]}</div></div><div class="apc"><div class="apc-l">Virya</div><div class="apc-v">${VIRYA[mi]}</div></div><div class="apc"><div class="apc-l">Dosha Effect</div><div class="apc-v">${DEFF[mi]}</div></div><div class="apc"><div class="apc-l">Best Time</div><div class="apc-v">${TIMES[mi]}</div></div></div><div class="s-lbl">Rasa — Taste Profile</div><div class="rasa-wrap">${rH}</div><div class="s-lbl">Preparation</div><div class="prep-tip"><span class="pt-ic">🌿</span><span class="pt-tx">${PREP[mi]}</span></div>`;
    }

    /* ── VIDEO CARDS — new large card design ── */
    function buildVid(mi) {
      const cards = VIDS.map((v, vi) => {
        const pc = v.score >= 70 ? 'hi' : v.score >= 45 ? 'mi' : 'lo';

        const xH = (v.x || []).map(i => `<span class="vc-chip x">${i}</span>`).join('');
        return `
    <div class="vc" id="vc${vi}">
      <!-- large thumbnail -->
      <div class="vc-thumb" onclick="toggleVC(${vi},'${v.id}')">
        <img src="${v.th}" alt="${v.t}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>

      </div>
    </div>`;
      }).join('');

      document.getElementById('tab-vid').innerHTML = `

      setTimeout(() => {
        const b = document.getElementById('vbf0');
        if (b) b.style.width = VIDS[0].score + '%';
        document.getElementById('vc0').classList.add('open');

    function toggleVC(vi, vidId) {

        const c = document.getElementById('vc' + i);

      if (!wasOpen) {
        openVC = vi;
        card.classList.add('open');
        setTimeout(() => {
          const b = document.getElementById('vbf' + vi);
          if (b) b.style.width = VIDS[vi].score + '%';
        }, 50);
      } else { openVC = -1; }
    }

    function togglePlay(e, vi, id) {
      e.stopPropagation();
      if (playingVid[vi]) { stopVid(vi); return; }
      Object.keys(playingVid).forEach(k => { if (playingVid[k]) stopVid(+k); });
      const player = document.getElementById('vpl' + vi), btn = document.getElementById('vbtn' + vi);
      if (!player || !btn) return;
      /* hide the static thumb, show player */
      const thumb = document.querySelector('#vc' + vi + ' .vc-thumb');
      if (thumb) thumb.style.display = 'none';
      player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" frameborder="0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;display:block;"></iframe>`;
      player.classList.add('on');
      btn.innerHTML = '■&nbsp;&nbsp;Stop Video'; btn.classList.add('stop');
      playingVid[vi] = true;
    }
    function stopVid(vi) {
      const player = document.getElementById('vpl' + vi), btn = document.getElementById('vbtn' + vi);
      if (player) { player.innerHTML = ''; player.classList.remove('on'); }
      const thumb = document.querySelector('#vc' + vi + ' .vc-thumb');
      if (thumb) thumb.style.display = '';
      if (btn) { btn.innerHTML = '▶&nbsp;&nbsp;Watch Recipe Video'; btn.classList.remove('stop'); }
      playingVid[vi] = false;
    }

    function switchTab(n, el) {
      document.querySelectorAll('.stab').forEach(t => t.classList.remove('on'));
      document.querySelectorAll('.spane').forEach(p => p.classList.remove('on'));
      if (el) el.classList.add('on');
      const p = document.getElementById('tab-' + n); if (p) p.classList.add('on');
    }

    window.addEventListener('resize', () => {
      if (document.getElementById('sheet').classList.contains('open')) applySheetHeight();
    });

    buildCal(); selDay(0);
  </script>
</body>

</html>
